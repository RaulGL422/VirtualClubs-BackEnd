# ============================================================
# Configuración para tests — sobreescribe application-dev.properties
# ============================================================

# H2 en memoria (no necesita PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT — secreto de test (mínimo 32 bytes para HS256)
jwt.secret=test-jwt-secret-for-unit-and-integration-tests-only
jwt.expiration=36000000
jwt.refreshExpiration=604800000

# Google — valor falso; GoogleAuthService es @MockBean en los tests
google.id=test-google-client-id

# Mail — no se conecta; MailerService es @MockBean en los tests
spring.mail.host=localhost
spring.mail.port=25

# Sin SSL en tests (WebEnvironment.MOCK no levanta servidor real)
server.ssl.enabled=false
server.port=0
