# ============================================================
# Configuración para tests — sobreescribe application-dev.properties
# ============================================================

# H2 en memoria (no necesita PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT — secreto de test en Base64 estándar (JwtUtils usa Decoders.BASE64.decode)
# Decodifica a "test-secret-key-for-tests-only!!" (32 bytes, válido para HS256)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy1vbmx5ISE=
jwt.expiration=36000000
jwt.refreshExpiration=604800000

# Google — valor falso; GoogleAuthService es @MockBean en los tests
google.id=test-google-client-id

# Mail — no se conecta; EmailService es @MockitoBean en los tests
spring.mail.host=localhost
spring.mail.port=25
# Evita que MailHealthContributorAutoConfiguration falle cuando JavaMailSender está mockeado
management.health.mail.enabled=false

# Sin SSL en tests (WebEnvironment.MOCK no levanta servidor real)
server.ssl.enabled=false
server.port=0

spring.flyway.enabled=false

# Rate limiting — valores altos para no interferir con los tests de integración
# (los tests de RateLimitingFilterTest usan su propio contexto con límites reales)
rate-limiting.limits[/v1/auth/login]=1000
rate-limiting.limits[/v1/auth/register]=1000
rate-limiting.limits[/v1/auth/requestPasswordReset]=1000
rate-limiting.limits[/v1/auth/requestVerify]=1000
