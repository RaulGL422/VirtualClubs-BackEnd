logging.level.root=INFO
logging.level.galindo.raul.virtualclubs=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

# URL base de la API en desarrollo local — sobreescribe el valor de producción en application.properties
app.api-base-url=${API_BASE_URL_DEBUG:http://localhost:8080}

# CORS ampliado en desarrollo — permite herramientas locales
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8080

management.endpoints.web.exposure.include=health,info,metrics,logfile

server.port=${PORT}

# ============================
# Database
# ============================
spring.datasource.url=jdbc:postgresql://${URL_DATABASE_POSTGRES_DEBUG}:${PORT_DATABASE_POSTGRES_DEBUG}/${NAME_DATABASE_POSTGRES_DEBUG}
spring.datasource.username=${USERNAME_DATABASE_POSTGRES_DEBUG}
spring.datasource.password=${PASSWORD_DATABASE_POSTGRES_DEBUG}

# ============================
# JWT
# ============================
jwt.secret=${JWT_SECRET_DEBUG}

# ============================
# Google Content ID
# ============================
google.id=${GOOGLE_CLIENT_ID_DEBUG}

debug=true

