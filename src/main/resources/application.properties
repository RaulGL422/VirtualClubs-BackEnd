spring.application.name=Virtual Clubs
spring.profiles.active=dev

app.cors.allowed-origins=http://localhost:3000

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.expiration=36000000
jwt.refreshExpiration=604800000

info.app.name=VirtualClubs
info.app.description=Backend for VirtualClubs sports clubs management
info.app.version=0.0.1

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================
# Verification Config
# ============================
app.token.emailVerificationExpiryMinutes=10
app.token.passwordResetExpiryMinutes=5