# ============================
# App config
# ============================
spring.application.name=Virtual Clubs

info.app.name=VirtualClubs
info.app.description=Backend for VirtualClubs sports clubs management
info.app.version=0.0.1

spring.profiles.active=dev

app.deeplink-url=https://virtualclubs-backend.onrender.com

# ============================
# Metrics
# ============================
app.cors.allowed-origins=https://virtualclubs-backend.onrender.com:3000

# ============================
# Database
# ============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ============================
# JWT
# ============================
jwt.expiration=36000000
jwt.refreshExpiration=604800000