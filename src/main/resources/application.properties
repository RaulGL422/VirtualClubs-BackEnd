# ============================
# App config
# ============================
spring.application.name=Virtual Clubs

info.app.name=VirtualClubs
info.app.description=Backend for VirtualClubs sports clubs management
info.app.version=@project.version@

spring.profiles.active=${SPRING_PROFILE_ACTIVE:dev}

app.api-base-url=https://api-vc.rgal.dev

# ============================
# Metrics
# ============================
app.cors.allowed-origins=https://api-vc.rgal.dev

# ============================
# Database
# ============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================
# JWT
# ============================
jwt.expiration=36000000
jwt.refreshExpiration=604800000

# ============================
# Rate Limiting (peticiones/min por IP)
# Añade una línea por cada endpoint que quieras proteger
# ============================
rate-limiting.limits[/v1/auth/login]=5
rate-limiting.limits[/v1/auth/register]=3
rate-limiting.limits[/v1/auth/requestPasswordReset]=3
rate-limiting.limits[/v1/auth/requestVerify]=5
rate-limiting.limits[/v1/auth/google]=3

# ── Resend SMTP ──────────────────────────────────────────
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# ── App config ───────────────────────────────────────────
app.mail.from=noreply@rgal.dev
app.mail.from-name=VirtualClubs
app.frontend.url=https://rgal.dev

# ── Expiración de tokens de un solo uso (minutos) ────────
app.token.verification-expiry=1440
app.token.reset-expiry=30