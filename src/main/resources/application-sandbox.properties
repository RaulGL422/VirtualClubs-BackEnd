# ============================================================
# Perfil SANDBOX — BD local limpia para pruebas temporales
# ============================================================
# Arranca con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=sandbox
#
# No requiere ninguna variable de entorno.
# Los datos se pierden al parar la app (H2 in-memory).
# ============================================================

server.port=8080
app.api-base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:8081

# ── Base de datos: H2 en memoria ────────────────────────────
spring.datasource.url=jdbc:h2:mem:virtualclubs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el schema desde las entidades (Flyway no aplica)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway deshabilitado — el schema lo gestiona Hibernate
spring.flyway.enabled=false

# ── JWT — secret hardcodeado (solo para sandbox local) ───────
jwt.secret=sandbox-secret-key-for-local-testing-only-minimum-32chars!!

# ── Email — no se envían correos reales ──────────────────────
# Los emails fallan silenciosamente; el contenido (con tokens/URLs)
# aparece en consola al nivel DEBUG de galindo.raul.virtualclubs
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=sandbox
spring.mail.password=sandbox-not-used
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false

# ── Google OAuth — endpoint /v1/auth/google no funcionará ────
google.id=sandbox-google-client-id.apps.googleusercontent.com

# ── Logging ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.galindo.raul.virtualclubs=DEBUG
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
