<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f4f7;
            color: #333;
        }
        .wrapper {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header {
            background: #4f46e5;
            padding: 32px 40px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .body {
            padding: 40px;
        }
        .body p {
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            margin: 24px 0;
            padding: 14px 32px;
            background: #4f46e5;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
        }
        .btn:hover { background: #4338ca; }
        .note {
            font-size: 13px !important;
            color: #999 !important;
        }
        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 24px 0;
        }
        .footer {
            background: #f9f9fb;
            padding: 24px 40px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>VirtualClubs</h1>
    </div>
    <div class="body">
        <th:block th:replace="${content}"/>
    </div>
    <div class="footer">
        <p>© 2025 Tu App · Todos los derechos reservados</p>
        <p>Si no solicitaste este email, puedes ignorarlo.</p>
    </div>
</div>
</body>
</html>
