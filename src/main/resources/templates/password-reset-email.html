<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section>
    <p th:text="#{email.greeting(${name})}">Hola, Usuario.</p>
    <p th:text="#{email.reset.body}">Hemos recibido una solicitud para restablecer la contraseña.</p>
    <p th:utext="#{email.reset.validity(${expiryMinutes})}">El enlace es válido durante <strong>30</strong> minutos.</p>

    <a th:href="${resetUrl}" class="btn" th:text="#{email.reset.button}">Restablecer contraseña</a>

    <hr class="divider"/>
    <p class="note" th:text="#{email.reset.disclaimer}">Si no solicitaste este cambio, puedes ignorar este email.</p>
</section>
</body>
</html>
