logging.level.root=INFO
logging.level.galindo.raul.virtualclubs=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Confiar en headers de proxy (Render añade X-Forwarded-For real)
server.forward-headers-strategy=framework

# ============================
# Variables de entorno requeridas en producción
# (no tienen valor por defecto — la app falla al arrancar si faltan)
# ============================
#   PORT                            — puerto HTTP
#   URL_DATABASE_POSTGRES_PROD     — host:puerto de PostgreSQL
#   NAME_DATABASE_POSTGRES_PROD    — nombre de la base de datos
#   USERNAME_DATABASE_POSTGRES_PROD — usuario de BD
#   PASSWORD_DATABASE_POSTGRES_PROD — contraseña de BD
#   JWT_SECRET_PROD               — clave HMAC-SHA256 para JWT (mín. 32 chars)
#   RESEND_API_KEY                  — API key de Resend para envío de emails
# ============================
spring.datasource.url=jdbc:postgresql://${URL_DATABASE_POSTGRES_PROD}:${PORT_DATABASE_POSTGRES_DEBUG}/${NAME_DATABASE_POSTGRES_PROD}
spring.datasource.username=${USERNAME_DATABASE_POSTGRES_PROD}
spring.datasource.password=${PASSWORD_DATABASE_POSTGRES_PROD}
jwt.secret=${JWT_SECRET_PROD}
google.id=${GOOGLE_CONTENT_ID_PROD}

debug=false